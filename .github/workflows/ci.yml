name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Build the app
        run: ./scripts/build-app.sh
      - name: Smoke test sbswitch
        run: |
          dist/sbswitch version
          dist/sbswitch help

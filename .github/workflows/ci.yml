name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Apple Silicon and Intel: the tests run natively on each, and each runs
    # the universal keyturn on its own architecture.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          uname -m
          swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Build the app
        run: ./scripts/build-app.sh
      - name: Check the binaries are universal
        run: |
          for binary in dist/keyturn "dist/Keyturn.app/Contents/MacOS/KeyturnApp" "dist/Keyturn.app/Contents/MacOS/keyturn"; do
            echo "$(lipo -archs "$binary")  $binary"
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done
      - name: Smoke test keyturn
        run: |
          dist/keyturn version
          dist/keyturn help

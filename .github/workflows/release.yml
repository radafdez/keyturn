name: Release

# Push a tag like v1.1.0 to publish the app and sbswitch as a GitHub release.
# The build is signed ad hoc, not notarized: the README explains the first launch.
# Updates go through Sparkle: the zip and appcast.xml are signed with the EdDSA
# key in the SPARKLE_PRIVATE_KEY secret, and the app checks them against the
# public half in Resources/sparkle-public-key.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts commits. / El número de build cuenta commits.
          fetch-depth: 0
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/.*switchVersion = "\(.*\)".*/\1/p' Sources/SwitchCore/Version.swift)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but Version.swift says $version"; exit 1; }
      - name: Check the update keys
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -s Resources/sparkle-public-key.txt || { echo "No Resources/sparkle-public-key.txt: the app could not check updates"; exit 1; }
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "No SPARKLE_PRIVATE_KEY secret: the update could not be signed"; exit 1; }
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build-app.sh
      - name: Check the binaries are universal
        run: |
          for binary in dist/sbswitch "dist/Supabase Switch.app/Contents/MacOS/SupabaseSwitch" "dist/Supabase Switch.app/Contents/MacOS/sbswitch"; do
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "dist/Supabase Switch.app" "Supabase-Switch-$version.zip"
          ditto -c -k --norsrc --noextattr dist/sbswitch "sbswitch-$version.zip"
          shasum -a 256 *.zip > SHA256SUMS.txt
          # The notes are this version's section of CHANGELOG.md: Sparkle shows
          # them as they are, the release page adds how to install.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > CHANGES.md
          test -s CHANGES.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cp CHANGES.md NOTES.md
          cat >> NOTES.md <<'NOTE'

          ### Install

          `brew install --cask radafdez/tap/supabase-switch`, or unzip
          `Supabase-Switch-*.zip` and move the app to `/Applications`. The build is
          **not notarized**: the first launch is blocked until you click **Open
          Anyway** in System Settings → Privacy & Security. Or build from source — see
          the [README](https://github.com/radafdez/supabase-switch#install).
          NOTE
          sed -i '' 's/^          //' NOTES.md
      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh "Supabase-Switch-${GITHUB_REF_NAME#v}.zip" CHANGES.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Supabase Switch ${GITHUB_REF_NAME#v}" --notes-file NOTES.md *.zip SHA256SUMS.txt appcast.xml
